version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sulddara-mysql
    environment:
      MYSQL_DATABASE: matsul
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} # .env 파일이나 환경변수에서 가져옴
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: sulddara-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes # 비밀번호는 개발 편의상 뺐습니다.
    volumes:
      - redis-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: sulddara-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    command: >
      sh -c "if ! ./bin/elasticsearch-plugin list | grep -qx analysis-nori; then
        ./bin/elasticsearch-plugin install --batch analysis-nori;
      fi;
      exec /usr/local/bin/docker-entrypoint.sh"
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  mysql-data:
  redis-data:
  es-data:
