spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: server
  mvc:
    async:
      request-timeout: 1800000
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/matsul?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&connectTimeout=10000
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      leak-detection-threshold: 20000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 3600000
    refresh-token-expiration: 1209600000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  elasticsearch:
    uris: http://${ES_HOST:localhost}:9200
  cloud:
    aws:
      credentials:
        access-key: ${AWS_KEY}
        secret-key: ${AWS_SECRET}
      s3:
        bucket: matsul-image-storage-582802577055-ap-northeast-2-an
      region:
        static: ap-northeast-2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_ID}
            client-secret: ${GOOGLE_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:postmessage}
          naver:
            provider: naver
            client-id: ${NAVER_ID}
            client-secret: ${NAVER_SECRET}
            redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8080/login/oauth2/code/naver}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
              - profile_image
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
  external:
    kakao:
      local-search:
        url: ${KAKAO_LOCAL_SEARCH_URL:https://dapi.kakao.com/v2/local/search/keyword.json}
        api-key: ${KAKAO_API_KEY}
ai:
  base-url: ${AI_BASE_URL:http://ai:5000}
