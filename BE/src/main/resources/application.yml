spring:
  application:
    name: server

  mvc:
    async:
      # SSE(SseEmitter) 장시간 연결 — Tomcat 비동기 타임아웃과 동기화 (밀리초, 30분)
      request-timeout: 1800000

  datasource:
    url: jdbc:mysql://localhost:3306/matsul?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 3600000    # 1시간 (ms 단위)
    refresh-token-expiration: 1209600000 # 2주 (ms 단위)

  data:
    redis:
      host: localhost
      port: 6379

  elasticsearch:
    uris: http://localhost:9200

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_ID}
            client-secret: ${GOOGLE_SECRET}
            # @react-oauth/google auth-code popup(flow='auth-code')는 redirect_uri=postmessage로 code를 교환합니다.
            # 환경변수로 덮어쓸 수 있게 두되 기본값은 postmessage로 설정합니다.
            redirect-uri: ${GOOGLE_REDIRECT_URI:postmessage}
            scope:
              - email
              - profile

          naver:
            client-id: ${NAVER_ID}
            client-secret: ${NAVER_SECRET}
            scope:
              - name
              - email
              - profile_image
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:5173/login"

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  # 외부 API 연동 설정
  external:
    naver:
      local-search:
        url: https://openapi.naver.com/v1/search/local.json
        client-id: ${NAVER_ID}
        client-secret: ${NAVER_SECRET}
    kakao:
      local-search:
        url: https://dapi.kakao.com/v2/local/search/keyword.json
        api-key: ${KAKAO_API_KEY}

  cloud:
    aws:
      credentials:
        access-key: ${AWS_KEY}
        secret-key: ${AWS_SECRET}
      s3:
        bucket: matsul-image-storage-582802577055-ap-northeast-2-an
      region:
        static: ap-northeast-2
      stack:
        auto: false # 가상 환경에서 불필요한 스택 경고 방지

ai:
  base-url: ${AI_BASE_URL:http://localhost:5000}
